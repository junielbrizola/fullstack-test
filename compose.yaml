name: coderockr-investments

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    env_file:
      - ./infra/local/postgres.env
    environment:
      POSTGRES_DB: investment_manager
      POSTGRES_USER: investment_admin
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=auto
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migration:
    image: flyway/flyway:13.7.0
    restart: "no"
    env_file:
      - ./infra/local/migration.env
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/investment_manager
      FLYWAY_USER: investment_admin
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_CONNECT_RETRIES: "60"
    volumes:
      - ./apps/api/src/main/resources/db/migration:/flyway/sql:ro
    command: [migrate]
    depends_on:
      db:
        condition: service_healthy

  permissions:
    image: postgres:18.6-bookworm
    restart: "no"
    user: postgres
    env_file:
      - ./infra/local/migration.env
    command:
      - sh
      - -euc
      - >-
        export PGPASSWORD="$$FLYWAY_PASSWORD";
        exec psql --no-psqlrc --set=ON_ERROR_STOP=1 --host=db
        --username=investment_admin --dbname=investment_manager
        --file=/grant-runtime.sql
    volumes:
      - ./infra/postgres/grant-runtime.sql:/grant-runtime.sql:ro
    depends_on:
      migration:
        condition: service_completed_successfully

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./infra/local/api.env
    environment:
      DATABASE_URL: postgresql://db:5432/investment_manager
      DB_USER: investment_app
      PORT: "8080"
      BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-America/Sao_Paulo}
      WEB_ORIGIN: http://localhost:3000
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /q/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r response <&3;
          [[ "$$response" == *" 200 "* ]]'
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      permissions:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      API_INTERNAL_BASE_URL: http://api:8080
      API_PUBLIC_BASE_URL: http://localhost:8080
      PUBLIC_BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-America/Sao_Paulo}
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
