quarkus.application.name=investment-api
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.http.limits.max-body-size=16K
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.write-dates-as-timestamps=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:investment_app}
quarkus.datasource.password=${DB_PASSWORD:local-dev-only}
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5432/investment_manager}
quarkus.datasource.reactive.max-size=${DB_POOL_MAX_SIZE:12}
quarkus.datasource.reactive.cache-prepared-statements=true
quarkus.datasource.health.enabled=true

investment.business-zone=${BUSINESS_TIME_ZONE:America/Sao_Paulo}

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${WEB_ORIGIN:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Idempotency-Key
quarkus.http.cors.access-control-allow-credentials=false

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics

quarkus.log.category."com.coderockr.investments".level=INFO
